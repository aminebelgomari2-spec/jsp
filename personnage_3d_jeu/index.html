<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Contrôle du personnage 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9edcff;font-family:system-ui,Arial}
#game{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:14px;top:12px;color:#123044;background:#ffffffc9;padding:10px 13px;border-radius:12px;font-size:13px;backdrop-filter:blur(8px);line-height:1.45}
#hint{font-weight:700;font-size:14px}
#status{opacity:.8}
#mobile{position:fixed;inset:auto 0 18px 0;display:none;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}
.pad{display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px;gap:5px;pointer-events:auto}
.actionButtons{display:flex;gap:10px;align-items:end;pointer-events:auto}
button{border:1px solid #ffffffb0;background:#ffffffa8;color:#15334a;font-size:21px;font-weight:800;border-radius:17px;width:56px;height:56px;touch-action:none;box-shadow:0 3px 10px #28608030}
button:active{background:#fff}
#up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
.actionButtons button{width:65px;height:65px;border-radius:50%;font-size:13px}
#jump{background:#fff4b9d9}#dash{background:#ffd1a8e0}
@media (pointer:coarse){#mobile{display:flex}#hud{font-size:12px}}
#error{display:none;position:fixed;inset:20% 8% auto;background:#fff;padding:18px;border-radius:12px;color:#933}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div id="hint">Personnage 3D</div><div>Déplacement : ZQSD / WASD</div><div>Saut : ESPACE · Double saut en l’air</div><div>Dash : SHIFT</div><div id="status">Chargement du modèle…</div></div>
<div id="mobile">
  <div class="pad">
    <button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button>
  </div>
  <div class="actionButtons"><button id="dash">DASH</button><button id="jump">SAUT</button></div>
</div>
<div id="error"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const canvas=document.querySelector('#game'), status=document.querySelector('#status');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x9edcff); scene.fog=new THREE.Fog(0x9edcff,18,55);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,150);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
scene.add(new THREE.HemisphereLight(0xffffff,0x59748a,2.0));
const sun=new THREE.DirectionalLight(0xffffff,2.4); sun.position.set(-5,10,7); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x6bc36b,roughness:1}));
ground.rotation.x=-Math.PI/2; ground.position.y=-.04; ground.receiveShadow=true; scene.add(ground);
const grid=new THREE.GridHelper(200,100,0x4e9d54,0x83cf7d); grid.position.y=-.025; scene.add(grid);
const player=new THREE.Group(); scene.add(player);
let model=null, limbs={}; const loader=new GLTFLoader();
loader.load('./character.glb',g=>{
 model=g.scene; model.scale.setScalar(1); model.position.y=0;
 model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
 player.add(model);
 model.traverse(o=>{if(o.name==='arm_left')limbs.left=o;if(o.name==='arm_right')limbs.right=o;});
 status.textContent='Modèle chargé · saute et dash !';
},undefined,e=>{status.textContent='Impossible de charger character.glb'; const el=document.querySelector('#error');el.style.display='block';el.textContent='Place index.html et character.glb dans le même dossier (racine du projet GitHub). Lance le site via GitHub Pages ou un serveur web.';console.error(e);});

const keys=new Set(), touch={up:false,down:false,left:false,right:false};
let vy=0, jumps=0, dashTime=0, dashCooldown=0, walkTime=0;
const clock=new THREE.Clock();
const forward=new THREE.Vector3(), rightVec=new THREE.Vector3(), move=new THREE.Vector3();
const cameraOffset=new THREE.Vector3(0,4.1,7.5);
function jump(){if(jumps<2){vy=jumps===0?7.3:6.3;jumps++;}}
function dash(){if(dashCooldown<=0){dashTime=.18;dashCooldown=.75;}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys.add(k);if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(k===' '&&!e.repeat)jump();if(k==='shift'&&!e.repeat)dash();});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
function bindHold(id,key){const el=document.getElementById(id);const on=v=>{touch[key]=v;};el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);on(true)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>on(false));}
bindHold('up','up');bindHold('down','down');bindHold('left','left');bindHold('right','right');
document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
document.querySelector('#dash').addEventListener('pointerdown',e=>{e.preventDefault();dash()});
function animate(){
 requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),.04); const t=clock.elapsedTime;
 dashCooldown=Math.max(0,dashCooldown-dt);dashTime=Math.max(0,dashTime-dt);
 move.set(0,0,0);
 if(keys.has('w')||keys.has('z')||keys.has('arrowup')||touch.up)move.z-=1;
 if(keys.has('s')||keys.has('arrowdown')||touch.down)move.z+=1;
 if(keys.has('a')||keys.has('q')||keys.has('arrowleft')||touch.left)move.x-=1;
 if(keys.has('d')||keys.has('arrowright')||touch.right)move.x+=1;
 if(move.lengthSq()>0)move.normalize();
 const speed=dashTime>0?19:5.2;
 player.position.x+=move.x*speed*dt;player.position.z+=move.z*speed*dt;
 player.position.x=THREE.MathUtils.clamp(player.position.x,-40,40);player.position.z=THREE.MathUtils.clamp(player.position.z,-40,40);
 vy-=18*dt;player.position.y+=vy*dt;
 if(player.position.y<=0){player.position.y=0;vy=0;jumps=0;}
 const moving=move.lengthSq()>.001;
 if(moving)player.rotation.y=Math.atan2(move.x,move.z)+Math.PI;
 if(model){
   model.position.y=moving&&player.position.y===0?Math.abs(Math.sin(t*12))*.055:Math.sin(t*2.2)*.018;
   model.rotation.z=dashTime>0?-.20:THREE.MathUtils.damp(model.rotation.z,0,8,dt);
   model.scale.set(1,1,1);
   if(limbs.left&&limbs.right){
    const swing=moving?Math.sin(t*11)*.42:Math.sin(t*1.7)*.035;
    limbs.left.rotation.z=.30+swing;limbs.right.rotation.z=-.30-swing;
   }
 }
 camera.position.lerp(new THREE.Vector3(player.position.x+cameraOffset.x,player.position.y+cameraOffset.y,player.position.z+cameraOffset.z),1-Math.exp(-4*dt));
 camera.lookAt(player.position.x,player.position.y+1.05,player.position.z);
 renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
