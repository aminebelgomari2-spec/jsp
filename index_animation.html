<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Skeleton Green — contrôles HTML</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17191b;color:#fff;font:14px system-ui,Arial}canvas{display:block}#hud{position:fixed;inset:12px auto auto 12px;z-index:2;background:#101214d9;border:1px solid #ffffff25;border-radius:12px;padding:12px;max-width:min(360px,calc(100vw - 24px));backdrop-filter:blur(8px)}#hud strong{font-size:16px}#hud p{margin:6px 0;color:#d3d6d8;line-height:1.45}kbd{background:#303438;border:1px solid #62676c;border-radius:4px;padding:1px 5px;color:#fff}#status{color:#9cffaa!important}#buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}button{background:#24292c;color:#fff;border:1px solid #555d61;border-radius:8px;padding:8px 10px;font-weight:600}button:active{background:#3b4940}#err{color:#ff9b9b}#mobile{position:fixed;inset:auto 14px 18px auto;display:none;gap:8px;z-index:3;align-items:end}#mobile button{width:54px;height:54px;font-size:18px;background:#101214bb;touch-action:none}#mobile .col{display:grid;gap:7px;grid-template-columns:repeat(3,54px)}@media(max-width:700px){#mobile{display:flex}#hud{font-size:12px;max-width:calc(100vw - 24px)}#hud p{margin:4px 0}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="hud"><strong>☠ Skeleton Green</strong><p><kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> ou <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> : bouger · <kbd>Espace</kbd> : sauter · <kbd>Shift</kbd> : dash · souris : tourner la caméra</p><p id="status">Chargement du skin…</p><div id="buttons"><button id="reset">Recentrer caméra</button><button id="dance">Danse : OFF</button></div><p id="err"></p></div>
<div id="mobile"><div class="col"><span></span><button data-key="KeyW">▲</button><span></span><button data-key="KeyA">◀</button><button data-key="KeyS">▼</button><button data-key="KeyD">▶</button></div><div style="display:grid;gap:7px"><button data-key="Space">⤒</button><button data-key="ShiftLeft">⚡</button></div></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const status=document.querySelector('#status'),err=document.querySelector('#err');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x17191b);scene.fog=new THREE.Fog(0x17191b,18,55);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,200);camera.position.set(0,4.2,8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdfffe2,0x36383d,2.0));const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(5,10,6);key.castShadow=true;scene.add(key);const rim=new THREE.DirectionalLight(0x83ff9a,2);rim.position.set(-5,5,-5);scene.add(rim);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x292d2f,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-.04;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(200,100,0x444a4c,0x303537);grid.position.y=-.025;scene.add(grid);
const player=new THREE.Group();scene.add(player);let model=null,parts={},baseY=0,grounded=true,vy=0,dashTime=0,dashDir=new THREE.Vector3(),dance=false;const keys={};let yaw=0,pitch=.12,mouseDown=false,lastX=0,lastY=0;const velocity=new THREE.Vector3();
function findPart(root,exact){let found=null;root.traverse(o=>{if(o.name===exact)found=o});return found}
function pivotPart(obj,pivotWorld){if(!obj)return null;obj.updateWorldMatrix(true,false);const parent=obj.parent;const worldPos=new THREE.Vector3();obj.getWorldPosition(worldPos);const pivot=new THREE.Group();pivot.name=obj.name+' animation pivot';parent.add(pivot);pivot.position.copy(pivotWorld); // model parts are separate meshes with their geometry baked in place
 parent.updateWorldMatrix(true,false);const localPivot=parent.worldToLocal(pivotWorld.clone());pivot.position.copy(localPivot);
 const oldPos=obj.position.clone(),oldQuat=obj.quaternion.clone(),oldScale=obj.scale.clone();parent.remove(obj);pivot.add(obj);obj.position.copy(oldPos).sub(localPivot);obj.quaternion.copy(oldQuat);obj.scale.copy(oldScale);return pivot;}
const loader=new GLTFLoader();loader.load('./skeleton_roblox_skin_v2.glb',g=>{
 model=g.scene;player.add(model);model.updateMatrixWorld(true);
 const box=new THREE.Box3().setFromObject(model);const size=box.getSize(new THREE.Vector3());baseY=-box.min.y;model.position.y=baseY;model.scale.setScalar(1.65/Math.max(size.y,.01));model.updateMatrixWorld(true);
 // parts names in the supplied GLB. Pivots are estimated from each piece's bounding box.
 function makePivot(name,top=true){const obj=findPart(model,name);if(!obj)return null;const b=new THREE.Box3().setFromObject(obj);const p=new THREE.Vector3((b.min.x+b.max.x)/2,top?b.max.y:b.min.y,(b.min.z+b.max.z)/2);return pivotPart(obj,p)}
 parts.rightArm=makePivot('Right arm',true);parts.leftArm=makePivot('Left arm',true);parts.rightLeg=makePivot('Right leg',true);parts.leftLeg=makePivot('Left leg',true);
 model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material.side=THREE.DoubleSide}}});
 const b2=new THREE.Box3().setFromObject(player);player.position.y=-b2.min.y;status.textContent='Skin chargé ! Marche, saut et dash activés.';
},undefined,e=>{status.textContent='Impossible de charger le GLB.';err.textContent='Mets index_animation.html et skeleton_roblox_skin_v2.glb dans le même dossier. Ouvre la page avec un petit serveur web (pas toujours en double-cliquant le HTML).';console.error(e)});
function press(code,on){keys[code]=on}
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(!keys[e.code]&&e.code==='Space'&&grounded){vy=7.2;grounded=false}if(!keys[e.code]&&(e.code==='ShiftLeft'||e.code==='ShiftRight')){dashTime=.18;dashDir.set(-Math.sin(yaw),0,-Math.cos(yaw));if(keys.KeyW||keys.KeyZ)dashDir.set(-Math.sin(yaw),0,-Math.cos(yaw));else if(keys.KeyS)dashDir.set(Math.sin(yaw),0,Math.cos(yaw));else if(keys.KeyA||keys.KeyQ)dashDir.set(-Math.cos(yaw),0,Math.sin(yaw));else if(keys.KeyD)dashDir.set(Math.cos(yaw),0,-Math.sin(yaw));}keys[e.code]=true});addEventListener('keyup',e=>keys[e.code]=false);
document.querySelectorAll('[data-key]').forEach(b=>{const c=b.dataset.key;const down=e=>{e.preventDefault();if(c==='Space'&&!keys[c]&&grounded){vy=7.2;grounded=false}if(c==='ShiftLeft'&&!keys[c]){dashTime=.18;dashDir.set(-Math.sin(yaw),0,-Math.cos(yaw))}press(c,true)};const up=e=>{e.preventDefault();press(c,false)};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up)});
renderer.domElement.addEventListener('pointerdown',e=>{mouseDown=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>mouseDown=false);renderer.domElement.addEventListener('pointermove',e=>{if(!mouseDown)return;yaw-=(e.clientX-lastX)*.006;pitch=Math.max(-.15,Math.min(.65,pitch+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY});
document.querySelector('#reset').onclick=()=>{yaw=0;pitch=.12;camera.position.set(0,4.2,8)};document.querySelector('#dance').onclick=e=>{dance=!dance;e.target.textContent='Danse : '+(dance?'ON':'OFF')};
const clock=new THREE.Clock();const camTarget=new THREE.Vector3();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;const forward=keys.KeyW||keys.KeyZ||keys.ArrowUp,back=keys.KeyS||keys.ArrowDown,left=keys.KeyA||keys.KeyQ||keys.ArrowLeft,right=keys.KeyD||keys.ArrowRight;let moving=forward||back||left||right;const move=new THREE.Vector3((right?1:0)-(left?1:0),0,(back?1:0)-(forward?1:0));if(move.lengthSq())move.normalize();const speed=3.6;const worldMove=new THREE.Vector3(move.x,0,move.z).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);if(dashTime>0){player.position.addScaledVector(dashDir,15*dt);dashTime-=dt}else if(moving){player.position.addScaledVector(worldMove,speed*dt);player.rotation.y=Math.atan2(-worldMove.x,-worldMove.z)}vy-=18*dt;player.position.y+=vy*dt;if(player.position.y<0){player.position.y=0;vy=0;grounded=true}
const walk=moving&&grounded&&!dance;const swing=walk?Math.sin(t*10)*.55:0;if(parts.leftArm)parts.leftArm.rotation.x=walk?swing*.8:(dance?Math.sin(t*5)*.7:0);if(parts.rightArm)parts.rightArm.rotation.x=walk?-swing*.8:(dance?-Math.sin(t*5)*.7:0);if(parts.leftLeg)parts.leftLeg.rotation.x=walk?-swing:0;if(parts.rightLeg)parts.rightLeg.rotation.x=walk?swing:0;if(model){model.position.y=baseY+(grounded?Math.abs(Math.sin(t*10))*(walk?.025:0):0)}
const dist=7.2,camX=player.position.x+Math.sin(yaw)*Math.cos(pitch)*dist,camZ=player.position.z+Math.cos(yaw)*Math.cos(pitch)*dist;camTarget.set(player.position.x,player.position.y+1.2,player.position.z);camera.position.lerp(new THREE.Vector3(camX,player.position.y+2.5+Math.sin(pitch)*dist,camZ),.09);camera.lookAt(camTarget);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
